name: ahead-upgrade-from-v4 checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - name: Phase 0 credential-free acceptance (isolated API, worker, SQLite restore)
        run: AHEAD_VERIFY_PYTHON=python ./scripts/verify-phase0-offline.sh
      - name: Local API startup smoke test
        run: |
          python scripts/configure-local.py
          (cd backend && python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/ahead-api-smoke.log 2>&1) &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          python scripts/doctor-local.py --wait-api --timeout 25
          python - <<'PYTEST'
          import json
          from urllib.request import urlopen
          with urlopen('http://127.0.0.1:8000/health') as r:
              assert json.load(r) == {'ok': True}
          with urlopen('http://127.0.0.1:8000/ready') as r:
              assert json.load(r) == {'ready': True}
          print('PASS: live backend health and readiness')
          PYTEST
          (cd backend && python restore_drill.py)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ahead_ci
          POSTGRES_USER: ahead_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahead_test -d ahead_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: PostgreSQL M2 to v5 migration and multi-user isolation smoke
        run: python scripts/smoke-postgres.py
        env:
          AHEAD_TEST_PG_URL: postgresql://ahead_test:ci-disposable-only@127.0.0.1:5432/ahead_ci

  integration:
    needs: [backend, frontend, postgres]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: python scripts/configure-local.py
      - run: npm run build
        working-directory: frontend
        env:
          AHEAD_API_INTERNAL_URL: http://127.0.0.1:8000
      - name: Install isolated Chromium browser-test dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2.0'
          python -m playwright install --with-deps chromium
      - name: HTTP + Chromium end-to-end tests through Next.js and FastAPI
        run: |
          (cd backend && python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/ahead-api-integration.log 2>&1) &
          API_PID=$!
          (cd frontend && npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ahead-web-integration.log 2>&1) &
          WEB_PID=$!
          trap 'kill $WEB_PID $API_PID 2>/dev/null || true' EXIT
          if ! python scripts/smoke-local.py --wait 65 || ! python scripts/browser-smoke.py; then
            echo '--- Backend log (may contain request metadata) ---'
            tail -n 45 /tmp/ahead-api-integration.log
            echo '--- Next.js log ---'
            tail -n 45 /tmp/ahead-web-integration.log
            exit 1
          fi
        env:
          AHEAD_API_INTERNAL_URL: http://127.0.0.1:8000
